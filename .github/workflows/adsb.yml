# Every ~10 minutes, grab free airplane (ADS-B) data around New Mexico and save a
# GPS-quality summary on the "adsb-data" branch. The map reads it from there.
name: Airplane GPS data
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adsb
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get the last 24 hours of data
        run: |
          mkdir -p out
          git fetch --depth 1 origin adsb-data && git --work-tree=out checkout origin/adsb-data -- . || echo "starting fresh"
          git reset -q
      - name: Fetch planes
        run: python3 tools/adsb_fetch.py out
      - name: Save to the adsb-data branch (one commit, replaced each time)
        run: |
          cd out
          git init -q -b adsb-data
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add state.json latest.json grid.json
          git commit -q -m "Airplane GPS data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" adsb-data
